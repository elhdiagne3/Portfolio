<script id="email-protect">
(function(){
  'use strict';
  // Reconstruit le mailto au clic sans jamais exposer l'email en clair dans le DOM
  function decode(b64){
    try { return atob(b64); } catch(e){ return null; }
  }
  function bind(){
    document.querySelectorAll('.email-icon-link').forEach(function(a){
      if(a.dataset.emailBound === '1') return;
      a.dataset.emailBound = '1';
      a.addEventListener('click', function(e){
        e.preventDefault();
        var b64 = a.getAttribute('data-email-b64');
        if(!b64) return;
        var email = decode(b64);
        if(!email) return;
        // Ouvre le client mail sans exposer l'adresse dans le HTML statique
        window.location.href = 'mailto:' + email;
      });
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', bind);
  } else { bind(); }
  // Rebind apres un eventuel rerender
  window.addEventListener('load', bind);
})();
</script>

function getCurrentLang() {
  var v = null;
  try {
    v = localStorage.getItem('portfolio-lang') || localStorage.getItem('lang');
  } catch(e) {}
  // EN PAR DEFAUT
  if (v === 'fr' || v === 'en') return v;
  return 'en';
}

function setLang(lang) {
  if (lang !== 'fr' && lang !== 'en') lang = 'en';
  try {
    localStorage.setItem('portfolio-lang', lang);
    localStorage.setItem('lang', lang);
  } catch(e) {}
  document.documentElement.lang = lang;
  document.documentElement.setAttribute('data-lang', lang);
  applyTranslations(lang);
}

function applyTranslations(lang) {
  const dict = translations[lang] || translations.en;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] === undefined) return;
    if (el.hasAttribute('data-i18n-html')) {
      el.innerHTML = dict[key];
    } else {
      el.textContent = dict[key];
    }
  });

  const langBtn = document.getElementById('lang-toggle');
  if (langBtn) {
    langBtn.textContent = dict['nav.lang'];
    langBtn.setAttribute('aria-label', dict['nav.lang.label']);
  }

  // Bouton principal : pointe vers le PDF de la langue courante
  const dl = document.getElementById('cv-download');
  if (dl) {
    const prefix = window.location.pathname.includes('/projects/') ? '../' : '';
    dl.href = prefix + (lang === 'en' ? 'cv-en.pdf' : 'cv-fr.pdf');
  }
}

function toggleLang() {
  setLang(getCurrentLang() === 'fr' ? 'en' : 'fr');
}

// ============ FIX NUC : INIT UNIQUE + EN PAR DEFAUT ============
(function(){
  'use strict';
  window.translations = translations;
  window.setLang = setLang;
  window.toggleLang = toggleLang;
  window.getCurrentLang = getCurrentLang;

  function init(){
    // Force EN par defaut si aucune preference
    var cur = getCurrentLang();  // 'en' ou 'fr' memorise
    setLang(cur);

    // Bind bouton #lang-toggle
    var btn = document.getElementById('lang-toggle');
    if (btn && btn.dataset.i18nBound !== '1') {
      btn.dataset.i18nBound = '1';
      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        toggleLang();
      });
    }
    // Mettre a jour le texte du bouton (FR si EN actif, EN si FR actif)
    if (btn) {
      btn.textContent = (cur === 'en') ? 'FR' : 'EN';
      btn.setAttribute('title', (cur === 'en') ? 'Passer en francais' : 'Switch to English');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

<script id="robust-lang-applier">
(function(){
  'use strict';
  function log(){ try { console.log.apply(console, ['[LANG]'].concat([].slice.call(arguments))); } catch(e){} }

  function getLang(){
    try {
      var v = localStorage.getItem('portfolio-lang') || localStorage.getItem('lang');
      return (v === 'fr') ? 'fr' : 'en';
    } catch(e) { return 'en'; }
  }

  function apply(lang){
    if (lang !== 'fr' && lang !== 'en') lang = 'en';
    var dict = null;
    try { dict = window.translations && window.translations[lang]; } catch(e) { log('error getting dict:', e); }

    if (!dict) {
      log('ERREUR: window.translations["' + lang + '"] introuvable');
      log('window.translations =', typeof window.translations);
      if (window.translations) log('langues dispo:', Object.keys(window.translations));
      return 0;
    }

    var count = 0;
    var missing = [];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n');
      if (dict[k] !== undefined) {
        if (el.hasAttribute('data-i18n-html')) el.innerHTML = dict[k];
        else el.textContent = dict[k];
        count++;
      } else {
        if (missing.length < 5) missing.push(k);
      }
    });

    var attrMap = {
      'data-i18n-placeholder':'placeholder',
      'data-i18n-title':'title',
      'data-i18n-aria-label':'aria-label',
      'data-i18n-alt':'alt'
    };
    Object.keys(attrMap).forEach(function(da){
      var ta = attrMap[da];
      document.querySelectorAll('['+da+']').forEach(function(el){
        var k = el.getAttribute(da);
        if (dict[k] !== undefined) { el.setAttribute(ta, dict[k]); count++; }
      });
    });

    log('applied "' + lang + '":', count, 'elements');
    if (missing.length) log('cles manquantes (ex):', missing);

    // Forcer sur les <html>
    document.documentElement.lang = lang;
    document.documentElement.setAttribute('data-lang', lang);

    // Mettre a jour le bouton
    var btn = document.getElementById('lang-toggle');
    if (btn) {
      btn.textContent = (lang === 'en') ? 'FR' : 'EN';
      btn.setAttribute('title', (lang === 'en') ? 'Passer en francais' : 'Switch to English');
      btn.style.pointerEvents = 'auto';
      btn.style.cursor = 'pointer';
    }

    try {
      localStorage.setItem('portfolio-lang', lang);
      localStorage.setItem('lang', lang);
    } catch(e) {}

    return count;
  }

  function toggle(){
    var cur = getLang();
    log('toggle', cur, '->', cur === 'en' ? 'fr' : 'en');
    apply(cur === 'en' ? 'fr' : 'en');
  }
  window.toggleLang = toggle;
  window.setLang = apply;

  function init(){
    log('=== INIT ===');
    log('translations type:', typeof window.translations);
    log('langue sauvee:', getLang());

    var saved = null;
    try { saved = localStorage.getItem('portfolio-lang'); } catch(e) {}
    var target = (saved === 'fr') ? 'fr' : 'en';
    apply(target);

    var btn = document.getElementById('lang-toggle');
    if (!btn) { log('ERREUR: #lang-toggle introuvable'); return; }
    log('bouton #lang-toggle trouve');

    if (btn.dataset.robustBound === '1') return;
    btn.dataset.robustBound = '1';
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      log('clic bouton');
      toggle();
    });
    log('bouton bind OK');
  }

  function tryInit(tries){
    tries = tries || 0;
    if (window.translations || tries > 60) {
      init();
    } else {
      setTimeout(function(){ tryInit(tries + 1); }, 50);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ tryInit(0); });
  } else {
    tryInit(0);
  }
  window.addEventListener('load', function(){ if (!window.__langInitDone) { window.__langInitDone = true; tryInit(0); } });
})();
</script>
