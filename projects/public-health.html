<script id="dark-default-portfolio">
(function() {
    try {
        var saved = localStorage.getItem('theme');
        var theme = saved || 'dark';   // DARK PAR DEFAUT DARK_PAR_DEFAUT_PORTFOLIO
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('dark');
    }
})();
</script>

<script id="i18n-global-portfolio">
(function() {
    'use strict';

    // Cle de stockage
    var LANG_KEY = 'portfolio-lang';

    // Recuperer la langue sauvee, sinon FR par defaut
    function getSavedLang() {
        try {
            return localStorage.getItem(LANG_KEY) || 'fr';
        } catch(e) {
            return 'fr';
        }
    }

    // Appliquer la langue a TOUT le document
    function applyLang(lang) {
        // 1. Attribut global
        document.documentElement.setAttribute('lang', lang);
        document.body && document.body.setAttribute('data-lang', lang);

        // 2. Traduire tous les elements [data-i18n]
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) {
            var key = nodes[i].getAttribute('data-i18n');
            if (window.i18n && window.i18n[lang] && window.i18n[lang][key] !== undefined) {
                var val = window.i18n[lang][key];
                if (nodes[i].tagName === 'INPUT' || nodes[i].tagName === 'TEXTAREA') {
                    nodes[i].placeholder = val;
                } else if (nodes[i].tagName === 'IMG') {
                    nodes[i].alt = val;
                } else {
                    nodes[i].textContent = val;
                }
            }
        }

        // 3. Traduire les attributs [data-i18n-placeholder], [data-i18n-title], [data-i18n-aria]
        var attrMap = {
            'data-i18n-placeholder': 'placeholder',
            'data-i18n-title': 'title',
            'data-i18n-aria-label': 'aria-label',
            'data-i18n-alt': 'alt'
        };
        Object.keys(attrMap).forEach(function(dataAttr) {
            var targetAttr = attrMap[dataAttr];
            var els = document.querySelectorAll('[' + dataAttr + ']');
            for (var j = 0; j < els.length; j++) {
                var k = els[j].getAttribute(dataAttr);
                if (window.i18n && window.i18n[lang] && window.i18n[lang][k] !== undefined) {
                    els[j].setAttribute(targetAttr, window.i18n[lang][k]);
                }
            }
        });

        // 4. Mettre a jour le label du bouton langue
        var label = document.querySelector('.lang-label, #langLabel');
        if (label) {
            label.textContent = lang === 'fr' ? 'FR' : 'EN';
        }
        var btn = document.querySelector('.lang-toggle, #langToggle, .lang-switcher');
        if (btn) {
            btn.setAttribute('data-current-lang', lang);
            btn.setAttribute('aria-label', lang === 'fr' ? 'Passer en anglais' : 'Switch to French');
        }

        // 5. Evenement global pour les scripts qui veulent reagir
        try {
            var ev = new CustomEvent('langchange', { detail: { lang: lang } });
            document.dispatchEvent(ev);
        } catch(e) {}
    }

    // Changer la langue : stocke + applique + met a jour
    window.setLang = function(lang) {
        if (lang !== 'fr' && lang !== 'en') lang = 'fr';
        try { localStorage.setItem(LANG_KEY, lang); } catch(e) {}
        applyLang(lang);
    };

    // Toggle FR <-> EN
    window.toggleLang = function() {
        var current = getSavedLang();
        window.setLang(current === 'fr' ? 'en' : 'fr');
    };

    // Au chargement : appliquer la langue sauvee
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            applyLang(getSavedLang());
        });
    } else {
        applyLang(getSavedLang());
    }

    // Attacher automatiquement au bouton langue s'il existe
    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.querySelector('.lang-toggle, #langToggle, .lang-switcher, #lang-switcher, .language-selector');
        if (btn && !btn.dataset.i18nBound) {
            btn.dataset.i18nBound = '1';
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                window.toggleLang();
            });
        }
    });
})();
</script>
