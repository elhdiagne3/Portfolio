<!DOCTYPE html>
<html>
<head>
<script id="dark-default-portfolio">
(function() {
    try {
        var saved = localStorage.getItem('theme');
        var theme = saved || 'dark';   // DARK PAR DEFAUT DARK_PAR_DEFAUT_PORTFOLIO
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('dark');
    }
})();
</script>
<meta charset="UTF-8">
<title>Data Analysis</title>

<script id="i18n-robust-fix">
(function() {
    'use strict';
    var LANG_KEY = 'portfolio-lang';
    var DEBUG = true;
    function log() { if (DEBUG) console.log.apply(console, ['[i18n]'].concat([].slice.call(arguments))); }

    function getLang() {
        try { return localStorage.getItem(LANG_KEY) || 'fr'; } catch(e) { return 'fr'; }
    }
    function setLang(lang) {
        if (lang !== 'fr' && lang !== 'en') lang = 'fr';
        try { localStorage.setItem(LANG_KEY, lang); } catch(e) {}
        apply(lang);
    }
    function toggleLang() {
        setLang(getLang() === 'fr' ? 'en' : 'fr');
    }

    function apply(lang) {
        log('apply lang =', lang);
        document.documentElement.lang = lang;

        // Verifier que window.i18n existe
        if (!window.i18n || !window.i18n[lang]) {
            console.warn('[i18n] window.i18n manquant ou langue absente. Structure attendue : window.i18n = { fr:{...}, en:{...} }');
            // Fallback : essayer de lire une variable globale nommee i18n ou translations
            if (typeof i18n !== 'undefined' && i18n[lang]) window.i18n = i18n;
            else if (typeof translations !== 'undefined' && translations[lang]) window.i18n = translations;
        }

        var dict = (window.i18n && window.i18n[lang]) || {};
        var count = 0;

        // data-i18n -> textContent
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
            var key = el.getAttribute('data-i18n');
            if (dict[key] !== undefined) {
                el.textContent = dict[key];
                count++;
            }
        });

        // data-i18n-placeholder / title / aria-label / alt
        var attrMap = {
            'data-i18n-placeholder': 'placeholder',
            'data-i18n-title': 'title',
            'data-i18n-aria-label': 'aria-label',
            'data-i18n-alt': 'alt'
        };
        Object.keys(attrMap).forEach(function(da) {
            var ta = attrMap[da];
            document.querySelectorAll('[' + da + ']').forEach(function(el) {
                var k = el.getAttribute(da);
                if (dict[k] !== undefined) { el.setAttribute(ta, dict[k]); count++; }
            });
        });

        log('elements traduits :', count, '/ data-i18n presents :', document.querySelectorAll('[data-i18n]').length);

        // Label du bouton
        var lbl = document.querySelector('.lang-label, #langLabel, .lang-toggle .label');
        if (lbl) lbl.textContent = lang.toUpperCase();

        // Evenement global
        document.dispatchEvent(new CustomEvent('langchange', { detail: { lang: lang } }));
    }

    // Attacher le clic sur TOUS les candidats boutons langue
    function bindButtons() {
        var selectors = [
            '.lang-toggle', '#langToggle', '.lang-switcher', '#lang-switcher',
            '.language-selector', '#languageSelector', '[data-action="toggle-lang"]',
            'button[aria-label*="lang" i]', 'button[title*="lang" i]', '[onclick*="Lang"]'
        ];
        var found = 0;
        selectors.forEach(function(sel) {
            document.querySelectorAll(sel).forEach(function(btn) {
                if (btn.dataset.i18nRobustBound === '1') return;
                btn.dataset.i18nRobustBound = '1';
                btn.addEventListener('click', function(e) {
                    e.preventDefault(); e.stopPropagation();
                    log('clic bouton langue ->', btn);
                    toggleLang();
                }, true);
                found++;
            });
        });
        log('boutons langue attaches :', found);
        if (found === 0) console.warn('[i18n] Aucun bouton langue detecte. Ajoutez class="lang-toggle" sur votre bouton.');
    }

    // Exposer globalement
    window.setLang = setLang;
    window.toggleLang = toggleLang;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            bindButtons();
            apply(getLang());
        });
    } else {
        bindButtons();
        apply(getLang());
    }
})();
</script>
</body>
