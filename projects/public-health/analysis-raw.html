<script id="dark-default-portfolio">
(function() {
    try {
        var saved = localStorage.getItem('theme');
        var theme = saved || 'dark';   // DARK PAR DEFAUT DARK_PAR_DEFAUT_PORTFOLIO
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('dark');
    }
})();
</script>

<h1>Notebook 2 : Data Analysis</h1><p>Analyse univariée, bivariée et ACP (PCA) des données Open Food Facts.</p><p><em>(Le notebook complet est disponible dans le fichier source)</em></p>


<script id="lang-nuclear-fix">
(function(){
  'use strict';
  var KEY = 'portfolio-lang';
  var DEBUG = true;
  function log(){ if(DEBUG) console.log.apply(console, ['[LANG]'].concat([].slice.call(arguments))); }

  // Recuperer la langue
  function getLang(){
    try { var v = localStorage.getItem(KEY); if(v==='fr'||v==='en') return v; } catch(e){}
    return 'fr';
  }
  function setLang(l){
    if(l!=='fr'&&l!=='en') l='fr';
    try { localStorage.setItem(KEY, l); } catch(e){}
    apply(l);
  }
  window.setLang = setLang;
  window.toggleLang = function(){ var cur=getLang(); log('toggle', cur, '->', cur==='fr'?'en':'fr'); setLang(cur==='fr'?'en':'fr'); };

  // Chercher le dictionnaire de traductions de facon agressive
  function getDict(lang){
    var sources = [window.i18n, window.translations, window.LANG, window.messages];
    // Variable globale directe 'i18n'
    try { if(typeof i18n !== 'undefined') sources.push(i18n); } catch(e){}
    try { if(typeof translations !== 'undefined') sources.push(translations); } catch(e){}
    for(var i=0;i<sources.length;i++){
      var s = sources[i];
      if(s && s[lang] && typeof s[lang]==='object') return s[lang];
    }
    return null;
  }

  // Appliquer la langue
  function apply(lang){
    log('apply', lang);
    document.documentElement.lang = lang;
    if(document.body) document.body.setAttribute('data-lang', lang);

    var dict = getDict(lang);
    if(!dict){ console.warn('[LANG] Aucun dictionnaire trouve pour', lang, '- verifiez js/i18n.js'); }
    var n = 0;

    // [data-i18n] -> textContent
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n');
      if(dict && dict[k]!==undefined){
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') el.placeholder = dict[k];
        else if(el.tagName==='IMG') el.alt = dict[k];
        else el.textContent = dict[k];
        n++;
      }
    });

    // Attributs
    var amap = {'data-i18n-placeholder':'placeholder','data-i18n-title':'title','data-i18n-aria-label':'aria-label','data-i18n-alt':'alt'};
    Object.keys(amap).forEach(function(da){
      document.querySelectorAll('['+da+']').forEach(function(el){
        var k = el.getAttribute(da);
        if(dict && dict[k]!==undefined){ el.setAttribute(amap[da], dict[k]); n++; }
      });
    });

    log('traduits:', n, '/ total data-i18n:', document.querySelectorAll('[data-i18n]').length);

    // Label bouton
    document.querySelectorAll('.lang-label,#langLabel,.lang-toggle .label').forEach(function(el){
      el.textContent = lang.toUpperCase();
    });
    document.dispatchEvent(new CustomEvent('langchange',{detail:{lang:lang}}));
  }

  // Attacher le clic — TRES LARGE : tout ce qui ressemble a un bouton langue
  function bind(){
    var sel = [
      '.lang-toggle','#langToggle','.lang-switcher','#lang-switcher',
      '.language-selector','#languageSelector','[data-action="toggle-lang"]',
      '[data-lang-toggle]','#langBtn','.lang-btn','#lang-btn','.btn-lang',
      'button[aria-label*="lang" i]','button[title*="lang" i]',
      'a[aria-label*="lang" i]','a[title*="lang" i]',
      '[onclick*="Lang"]','[onclick*="lang"]'
    ];
    var total = 0;
    var seen = new Set();
    sel.forEach(function(s){
      try {
        document.querySelectorAll(s).forEach(function(btn){
          if(seen.has(btn)) return;
          seen.add(btn);
          if(btn.dataset.langBound==='1') return;
          btn.dataset.langBound='1';
          // Forcer la visibilite
          btn.style.display = btn.style.display || 'inline-flex';
          btn.style.visibility = 'visible';
          btn.style.opacity = '1';
          btn.style.pointerEvents = 'auto';
          btn.addEventListener('click', function(e){
            e.preventDefault(); e.stopPropagation();
            log('CLIC bouton', btn);
            window.toggleLang();
          }, true);
          total++;
        });
      } catch(e){}
    });
    log('boutons langue attaches:', total);
    if(total===0){
      console.warn('[LANG] AUCUN bouton langue detecte. Ajoutez class="lang-toggle" a votre bouton.');
    }
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ bind(); apply(getLang()); });
  else { bind(); apply(getLang()); }

  // Rebind apres chargement complet (au cas ou d'autres scripts remplacent le DOM)
  window.addEventListener('load', function(){ bind(); });
})();
</script>
